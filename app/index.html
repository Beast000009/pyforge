<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PyForge — Get Good at Python</title>
  <link rel="stylesheet" href="styles.css?v=16" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css" />
</head>
<body>
  <div id="root"></div>

  <!-- React 18 + Babel Standalone -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>

  <!-- xterm.js for Docker lab terminals -->
  <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.js"></script>

  <!-- Course content (plain JS — sets window.COURSE_DATA + helpers) -->
  <script src="data/course-data.js?v=16"></script>
  <script src="data/lab-helpers.js?v=16"></script>

  <!-- Lib layer (no JSX) -->
  <script src="lib/persistence.js?v=16"></script>
  <script src="lib/store.js?v=16"></script>
  <script src="lib/keyboard.js?v=16"></script>
  <script src="lib/command-registry.js?v=16"></script>
  <script src="lib/lab-server-client.js?v=16"></script>

  <!-- Components -->
  <script type="text/babel" src="components/Toasts.jsx?v=16"></script>
  <script type="text/babel" src="components/MobileNav.jsx?v=16"></script>
  <script type="text/babel" src="components/KeyboardHelp.jsx?v=16"></script>
  <script type="text/babel" src="components/CodeBlock.jsx?v=16"></script>
  <script type="text/babel" src="components/LabPane.jsx?v=16"></script>
  <script type="text/babel" src="components/LessonView.jsx?v=16"></script>
  <script type="text/babel" src="components/HomeScreen.jsx?v=16"></script>
  <script type="text/babel" src="components/PracticePanel.jsx?v=16"></script>
  <script type="text/babel" src="components/ProgressPanel.jsx?v=16"></script>
  <script type="text/babel" src="components/FlagsPage.jsx?v=16"></script>
  <script type="text/babel" src="components/CommandPalette.jsx?v=16"></script>
  <script type="text/babel" src="components/Sidebar.jsx?v=16"></script>
  <script type="text/babel" src="components/App.jsx?v=16"></script>
</body>
</html>
